name: gtc2026-earth2-stormcast

# Brev launchable for the GTC2026 "Hands-On with Earth-2" (StormCast) workshop.
#
# IMPORTANT - how this works on Brev:
#   Brev copies *only this compose file* to the instance and runs
#   `docker compose up -d`; it does NOT clone the repo. So the build context is
#   a *git URL* - BuildKit clones the repo itself and uses this workshop
#   directory as the build context. The image is built locally from the
#   PhysicsNeMo base on the instance; nothing is pulled from / pushed to a
#   private registry.
#
# To build from local working-tree changes instead, override the context:
#   docker compose -f brev/docker-compose.yml build \
#     --set jupyter.build.context=..
#   (run from this workshop directory), then `up`.

services:
  jupyter:
    build:
      # git context: <repo>.git#<ref>:<subdir>. dockerfile + COPY paths are
      # relative to <subdir> (this workshop directory).
      context: "https://github.com/niallrobinson/End-to-End-AI-for-Science.git#brev-launchable:workspace/python/jupyter_notebook/GTC2026_HandsOnWithEarth-2"
      dockerfile: brev/dockerfile
    # GPU + large-workload settings (mirrors the workshop's docker run flags).
    privileged: true
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    shm_size: 1g
    ports:
      - "8888:8888"  # JupyterLab
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
