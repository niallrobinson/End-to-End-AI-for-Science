name: gtc2026-earth2-stormcast

# Brev launchable for the GTC2026 "Hands-On with Earth-2" (StormCast) workshop.
#
# Use this with a Brev **VM-mode** launchable (NOT compose-mode, which requires
# a prebuilt image). In VM mode Brev clones this repo onto the instance and runs
# brev/launch.sh, which brings this stack up with `docker compose up -d`. The
# image is built locally from the PhysicsNeMo base on the instance; nothing is
# pulled from / pushed to a private registry. See brev/README.md.

services:
  jupyter:
    build:
      # Local context = the workshop directory (parent of brev/). Available
      # because Brev clones the repo onto the VM in VM mode.
      context: ..
      dockerfile: brev/dockerfile
    # GPU + large-workload settings (mirrors the workshop's docker run flags).
    privileged: true
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    shm_size: 1g
    ports:
      - "8888:8888"  # JupyterLab
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
